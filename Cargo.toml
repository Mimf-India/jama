[workspace]
resolver = "2"
members = ["crates/jama-core", "crates/jama-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["JAMA contributors"]
repository = "https://github.com/Mimf-India/jama"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
