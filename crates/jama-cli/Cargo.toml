[package]
name = "jama-cli"
description = "JAMA: plain-text accounting as one self-contained binary"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "jama"
path = "src/main.rs"

[dependencies]
jama-core = { path = "../jama-core" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde_json = "1"
unicode-width = "0.1"
unicode-segmentation = "1"
rust_decimal = { version = "1", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
