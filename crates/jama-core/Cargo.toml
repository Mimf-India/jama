[package]
name = "jama-core"
description = "JAMA plain-text accounting core: model, parser, store, reports"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
csv = "1"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "parse_and_validate"
harness = false
path = "../../benches/parse_and_validate.rs"

[[bench]]
name = "balance"
harness = false
path = "../../benches/balance.rs"

[[bench]]
name = "register"
harness = false
path = "../../benches/register.rs"

[[bench]]
name = "import"
harness = false
path = "../../benches/import.rs"
